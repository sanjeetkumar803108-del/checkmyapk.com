<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#070a09"/>
  
  <!-- Subtle Grid Background -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
    <radialGradient id="emeraldGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#070a09" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#emeraldGlow)"/>

  <!-- Top Hairline Accent -->
  <line x1="200" y1="0" x2="1000" y2="0" stroke="#34d399" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Brand Eyebrow -->
  <g transform="translate(100, 140)">
    <rect width="320" height="36" rx="6" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1"/>
    <circle cx="20" cy="18" r="4" fill="#34d399"/>
    <text x="34" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#6ee7b7" letter-spacing="1.5">OWASP MASVS v2 · SEC SCANNER</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="260" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="-1.5">
    Find leaked secrets and flaws
  </text>
  <text x="100" y="335" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="58" font-weight="700" fill="#34d399" letter-spacing="-1.5">
    in your APK or Web App.
  </text>

  <!-- Subtitle -->
  <text x="100" y="405" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" fill="#94a3b8" letter-spacing="-0.2">
    Decompile Android binaries or probe live endpoints in seconds with zero server retention.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 480)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="46" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="24" y="28" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#ffffff">35+ Security Rules</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="220" height="46" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="264" y="28" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#ffffff">0s Disk Retention</text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="220" height="46" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="504" y="28" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#ffffff">PDF &amp; JSON Exports</text>
  </g>

  <!-- Domain Tag in Bottom Right -->
  <text x="1100" y="580" text-anchor="end" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" fill="#ffffff">
    CheckMyAPK<tspan fill="#34d399">.com</tspan>
  </text>
</svg>

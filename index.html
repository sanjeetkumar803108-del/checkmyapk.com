    <script>
      try {
        var t = localStorage.getItem('checkmyapk_theme');
        if (t === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
          document.documentElement.style.colorScheme = 'light';

      } catch (e) {}
